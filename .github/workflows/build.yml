name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests and capture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/screenshot
          pytest test/ 2>&1 | tee test/screenshot/test-output.txt

      - name: Run application and capture
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test/screenshot
          python hello_world.py 2>&1 | tee test/screenshot/run-output.txt

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-evidence-python
          path: test/screenshot/**
          retention-days: 90

      - name: Commit screenshot evidence back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screenshot/
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist screenshot evidence for python [skip ci]"
            git push
          else
            echo "No changes to test/screenshot/ — skipping commit"
          fi
