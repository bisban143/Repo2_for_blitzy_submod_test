name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests and capture
        run: pytest test/ | tee test/screenshot/test-output.txt

      - name: Run application and capture
        run: python hello_world.py > test/screenshot/run-output.txt 2>&1

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-evidence-python
          path: test/screenshot/**

      - name: Commit and push evidence
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add test/screenshot/
          git diff --staged --quiet || git commit -m "ci: persist screenshot evidence"
          git push
